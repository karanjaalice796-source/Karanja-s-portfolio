services:
  - type: web
    name: nodevents
    runtime: node
    plan: starter
    rootDir: nodevents
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: nodevents-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
